<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palmata | Top Accounts Dashboard</title>
<style>
:root[data-theme="dark"] {
  --surface-page: #0d0d0d;
  --surface-1: #1a1a19;
  --surface-2: #222220;
  --surface-3: #2a2a28;
  --surface-4: #313130;
  --border: rgba(255,255,255,0.06);
  --border-strong: rgba(255,255,255,0.12);
  --text-primary: #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted: #898781;
  --gridline: #252523;
  --rep-1: #3987e5; --rep-2: #d95926; --rep-3: #199e70; --rep-4: #c98500; --rep-5: #d55181;
  --seq-fill: #3987e5; --seq-track: rgba(57,135,229,0.13);
  --tier-a: #0ca30c; --tier-a-bg: rgba(12,163,12,0.12);
  --tier-b: #e8a800; --tier-b-bg: rgba(232,168,0,0.12);
  --tier-c: #ec835a; --tier-c-bg: rgba(236,131,90,0.12);
  --status-priority: #3987e5; --status-priority-bg: rgba(57,135,229,0.13);
  --status-bench: #898781; --status-bench-bg: rgba(137,135,129,0.10);
  --status-stretch: #52514e; --status-stretch-bg: rgba(82,81,78,0.10);
  --detail-bg: #1d1d1c; --detail-inner: #212120;
}
:root[data-theme="light"] {
  --surface-page: #f1f1ef;
  --surface-1: #fcfcfb;
  --surface-2: #f4f4f2;
  --surface-3: #ebebea;
  --surface-4: #e3e3e1;
  --border: rgba(11,11,11,0.07);
  --border-strong: rgba(11,11,11,0.14);
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --gridline: #e8e8e6;
  --rep-1: #2a78d6; --rep-2: #c94f20; --rep-3: #1baf7a; --rep-4: #9e6e00; --rep-5: #c94a7a;
  --seq-fill: #2a78d6; --seq-track: rgba(42,120,214,0.10);
  --tier-a: #0a8a0a; --tier-a-bg: rgba(12,163,12,0.09);
  --tier-b: #9e6e00; --tier-b-bg: rgba(232,168,0,0.10);
  --tier-c: #b05030; --tier-c-bg: rgba(236,131,90,0.10);
  --status-priority: #1e5fba; --status-priority-bg: rgba(42,120,214,0.10);
  --status-bench: #737168; --status-bench-bg: rgba(137,135,129,0.09);
  --status-stretch: #6a6864; --status-stretch-bg: rgba(82,81,78,0.09);
  --detail-bg: #f5f5f3; --detail-inner: #eeeeed;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--surface-page);color:var(--text-primary);font-size:14px;line-height:1.5;min-height:100vh}

.header{background:var(--surface-1);border-bottom:1px solid var(--border);padding:0 32px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
.header-left{display:flex;align-items:center;gap:16px}
.logo-mark{width:32px;height:32px;background:linear-gradient(135deg,#199e70 0%,#3987e5 100%);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;letter-spacing:-0.5px;flex-shrink:0;box-shadow:0 2px 8px rgba(57,135,229,0.3)}
.header-title{font-size:15px;font-weight:700;color:var(--text-primary);letter-spacing:.005em}
.header-sep{width:1px;height:20px;background:var(--border-strong)}
.header-sub{font-size:12px;color:var(--text-muted);font-weight:500}
.header-right{display:flex;align-items:center;gap:10px}
.theme-btn{background:var(--surface-3);border:1px solid var(--border-strong);border-radius:7px;color:var(--text-secondary);cursor:pointer;font-size:12px;padding:5px 12px;font-family:inherit;transition:all .15s;font-weight:500}
.theme-btn:hover{background:var(--surface-4);color:var(--text-primary)}

.main{max-width:1360px;margin:0 auto;padding:32px 32px 80px}

/* KPI row */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px}
.kpi-card{background:var(--surface-1);border:1px solid var(--border);border-radius:14px;padding:22px 22px 20px;position:relative;overflow:hidden}
.kpi-card::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:14px 14px 0 0}
.kpi-card.c1::after{background:var(--seq-fill)}
.kpi-card.c2::after{background:var(--tier-a)}
.kpi-card.c3::after{background:linear-gradient(90deg,var(--tier-a) 0%,var(--tier-b) 50%,var(--tier-c) 100%)}
.kpi-card.c4::after{background:linear-gradient(90deg,var(--rep-1),var(--rep-3))}
.kpi-ghost{position:absolute;right:-6px;bottom:-16px;font-size:96px;font-weight:900;line-height:1;pointer-events:none;user-select:none;opacity:.04;color:var(--text-primary);letter-spacing:-4px}
.kpi-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--text-muted);margin-bottom:10px}
.kpi-value{font-size:40px;font-weight:800;color:var(--text-primary);line-height:1;margin-bottom:6px;letter-spacing:-1px}
.kpi-sub{font-size:12px;color:var(--text-secondary);line-height:1.4}
.tier-mini-bar{display:flex;gap:2px;height:5px;border-radius:3px;overflow:hidden;margin-top:12px;background:var(--surface-3)}
.kpi-contact-bar{height:5px;border-radius:3px;overflow:hidden;margin-top:10px;background:var(--surface-3);position:relative}
.kpi-contact-fill{height:100%;background:linear-gradient(90deg,var(--rep-1),var(--rep-3));border-radius:3px;transition:width .6s ease}

/* Rep tabs */
.rep-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.rep-tab{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:10px;cursor:pointer;border:1.5px solid var(--border);background:var(--surface-1);font-family:inherit;font-size:13px;font-weight:500;color:var(--text-secondary);transition:all .15s;white-space:nowrap}
.rep-tab:hover{background:var(--surface-2);color:var(--text-primary)}
.rep-tab.active{background:var(--surface-2);color:var(--text-primary);border-color:var(--border-strong);box-shadow:inset 0 0 0 1px rgba(255,255,255,0.04)}
.rep-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.rep-badge{font-size:10px;font-weight:600;color:var(--text-muted);background:var(--surface-3);border-radius:5px;padding:1px 6px;font-variant-numeric:tabular-nums}

/* Filters */
.filters-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filter-label{font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em}
.filter-pill{padding:5px 11px;border-radius:7px;background:var(--surface-1);border:1px solid var(--border);cursor:pointer;font-size:12px;color:var(--text-secondary);font-family:inherit;transition:all .12s;font-weight:500}
.filter-pill:hover{background:var(--surface-2);color:var(--text-primary)}
.filter-pill.active{background:var(--surface-3);border-color:var(--border-strong);color:var(--text-primary);font-weight:600}
.fdiv{height:16px;width:1px;background:var(--border-strong)}
.search-box{margin-left:auto;background:var(--surface-1);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--text-primary);font-family:inherit;width:220px;outline:none;transition:border-color .15s}
.search-box:focus{border-color:var(--border-strong)}
.search-box::placeholder{color:var(--text-muted)}

.result-line{font-size:12px;color:var(--text-muted);margin-bottom:12px;font-variant-numeric:tabular-nums;font-weight:500}

/* Table */
.table-wrap{background:var(--surface-1);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.acct-table{width:100%;border-collapse:collapse}
.acct-table thead th{padding:10px 14px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap;user-select:none}
.acct-table thead th.sort{cursor:pointer}
.acct-table thead th.sort:hover{color:var(--text-secondary)}
.acct-table thead th:first-child{padding-left:18px}
.acct-table tbody tr{border-bottom:1px solid var(--gridline);cursor:pointer;transition:background .08s}
.acct-table tbody tr:last-child{border-bottom:none}
.acct-table tbody tr.data-row:hover{background:var(--surface-2)}
.acct-table tbody tr.data-row.open{background:var(--detail-bg)}
.acct-table td{padding:13px 14px;vertical-align:middle}
.acct-table td:first-child{padding-left:18px}

.rep-bar{width:4px;height:36px;border-radius:2px;flex-shrink:0}
.rank-n{font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums;min-width:20px;font-weight:600}
.acct-name{font-size:13px;font-weight:700;color:var(--text-primary);line-height:1.3}
.org62-link{color:inherit;text-decoration:none;font-weight:inherit}
.org62-link:hover{text-decoration:underline;opacity:.85}
.acct-loc{font-size:11px;color:var(--text-muted);margin-top:2px}
.acct-contact-line{font-size:10px;font-weight:600;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.acct-contact-sep{font-weight:400;opacity:.6;margin:0 3px}
.acct-no-contact{font-size:10px;color:var(--text-muted);margin-top:3px;opacity:.45;font-style:italic}
.rep-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-secondary);font-weight:500}
.rep-chip-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

.score-cell{display:flex;align-items:center;gap:10px;min-width:110px}
.score-num{font-size:14px;font-weight:800;color:var(--text-primary);min-width:28px;font-variant-numeric:tabular-nums}
.score-track{flex:1;height:6px;background:var(--seq-track);border-radius:3px;overflow:hidden;max-width:70px}
.score-fill{height:100%;background:var(--seq-fill);border-radius:3px}

.tier-badge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;font-size:12px;font-weight:800;letter-spacing:.01em}
.tb-a{background:var(--tier-a-bg);color:var(--tier-a)}
.tb-b{background:var(--tier-b-bg);color:var(--tier-b)}
.tb-c{background:var(--tier-c-bg);color:var(--tier-c)}

.status-pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap;letter-spacing:.01em}
.sp-priority{background:var(--status-priority-bg);color:var(--status-priority)}
.sp-bench{background:var(--status-bench-bg);color:var(--status-bench)}
.sp-stretch{background:var(--status-stretch-bg);color:var(--status-stretch)}

.eng-btn{display:inline-flex;align-items:center;padding:4px 9px;border-radius:6px;border:1px solid var(--border-strong);background:transparent;font-size:11px;font-weight:600;color:var(--text-secondary);cursor:pointer;font-family:inherit;transition:all .12s;white-space:nowrap}
.eng-btn:hover{background:var(--surface-3)}
.eng-btn.yes{background:var(--tier-a-bg);color:var(--tier-a);border-color:transparent}

.chevron{font-size:9px;color:var(--text-muted);transition:transform .15s;display:inline-block;width:14px;text-align:center;opacity:.6}
.data-row.open .chevron{transform:rotate(90deg);opacity:1}

/* Detail panel */
.detail-tr td{padding:0;border-bottom:1px solid var(--gridline)}
.detail-panel{padding:20px 24px 24px 46px;background:var(--detail-inner);display:grid;grid-template-columns:2fr 1.4fr 1.4fr;gap:28px}
.dl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:6px}
.dt{font-size:12px;color:var(--text-secondary);line-height:1.6}
.sbd-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sbd-label{font-size:11px;color:var(--text-muted);min-width:90px}
.sbd-track{flex:1;height:4px;background:var(--seq-track);border-radius:2px;max-width:80px;overflow:hidden}
.sbd-fill{height:100%;background:var(--seq-fill);border-radius:2px}
.sbd-val{font-size:11px;font-weight:700;color:var(--text-secondary);min-width:24px;text-align:right;font-variant-numeric:tabular-nums}
.web-link{font-size:11px;color:var(--seq-fill);text-decoration:none;font-weight:500}
.web-link:hover{text-decoration:underline}

/* Contact card */
.contact-card{padding:14px 16px;background:var(--surface-3);border-radius:10px;border:1px solid var(--border)}
.contact-card.contact-empty{border-style:dashed;opacity:.65}
.contact-avatar{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0;letter-spacing:.01em}
.contact-name-txt{font-size:13px;font-weight:700;color:var(--text-primary);margin-top:10px;line-height:1.3}
.contact-title-txt{font-size:11px;color:var(--text-secondary);margin-top:3px;line-height:1.5}
.contact-email-link{font-size:11px;color:var(--seq-fill);text-decoration:none;display:block;margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.contact-email-link:hover{text-decoration:underline}
.contact-phone-txt{font-size:11px;color:var(--text-muted);margin-top:3px}
.contact-source-badge{display:inline-flex;align-items:center;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:2px 7px;border-radius:4px;margin-top:8px}
.csb-org62{background:rgba(57,135,229,0.12);color:var(--rep-1)}
.csb-web{background:rgba(25,158,112,0.12);color:var(--rep-3)}
.contact-empty-msg{font-size:11px;color:var(--text-muted);font-style:italic;line-height:1.5}


/* Contacts grid in detail panel */
.contacts-header{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.contacts-count{font-size:10px;font-weight:600;color:var(--text-muted);background:var(--surface-4);border-radius:4px;padding:1px 6px}
.contacts-scroll{max-height:270px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px}
.contacts-scroll::-webkit-scrollbar{width:4px}
.contacts-scroll::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:2px}
.citem{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:var(--surface-3);border-radius:8px;border:1px solid var(--border)}
.citem-avatar{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;letter-spacing:.01em}
.citem-body{flex:1;min-width:0}
.citem-name{font-size:11px;font-weight:700;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem-title{font-size:10px;color:var(--text-secondary);line-height:1.4;margin-top:1px}
.citem-email{font-size:10px;color:var(--seq-fill);text-decoration:none;display:block;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.citem-email:hover{text-decoration:underline}
.citem-phone{font-size:10px;color:var(--text-muted);margin-top:1px}
.contacts-none{font-size:11px;color:var(--text-muted);font-style:italic;line-height:1.5}

.empty{padding:64px 20px;text-align:center;color:var(--text-muted);font-size:13px;font-weight:500}

@media(max-width:900px){
  .kpi-row{grid-template-columns:repeat(2,1fr)}
  .detail-panel{grid-template-columns:1fr 1fr}
  .header-sub{display:none}
}
@media(max-width:600px){
  .main{padding:16px}
  .detail-panel{grid-template-columns:1fr}
  .search-box{width:140px}
}
</style>
</head>

  document.getElementById("kpiRow").innerHTML = `
    <div class="kpi-card c1">
      <div class="kpi-ghost">${n}</div>
      <div class="kpi-label">Total Accounts</div>
      <div class="kpi-value">${n}</div>
      <div class="kpi-sub">Across 5 reps &nbsp;·&nbsp; ${REP_ORDER.length} territories</div>
    </div>
    <div class="kpi-card c2">
      <div class="kpi-ghost">${pri}</div>
      <div class="kpi-label">Priority</div>
      <div class="kpi-value">${pri}</div>
      <div class="kpi-sub">${(pri/n*100).toFixed(0)}% of total &nbsp;·&nbsp; avg score ${avg}</div>
    </div>
    <div class="kpi-card c3">
      <div class="kpi-ghost">A</div>
      <div class="kpi-label">Tier Breakdown</div>
      <div class="kpi-value">${ta} <span style="font-size:18px;font-weight:500;color:var(--text-secondary)">Tier A</span></div>
      <div class="tier-mini-bar">
        <div style="width:${aP}%;background:var(--tier-a)"></div>
        <div style="width:${bP}%;background:var(--tier-b)"></div>
        <div style="width:${cP}%;background:var(--tier-c)"></div>
      </div>
      <div class="kpi-sub" style="margin-top:8px">A: ${ta} &nbsp; B: ${tb} &nbsp; C: ${tc||0}</div>
    </div>
    <div class="kpi-card c4">
      <div class="kpi-ghost">${contacts}</div>
      <div class="kpi-label">Contacts Found</div>
      <div class="kpi-value">${contacts}<span style="font-size:18px;font-weight:500;color:var(--text-secondary)">/${n}</span></div>
      <div class="kpi-contact-bar"><div class="kpi-contact-fill" style="width:${cPct}%"></div></div>
      <div class="kpi-sub" style="margin-top:8px">${cPct}% coverage &nbsp;·&nbsp; Org62 + web</div>
    </div>`;
}

function renderTabs() {
  const tabs = [["All", null]].concat(REP_ORDER.map(r=>[r, repColor(r)]));
  document.getElementById("repTabs").innerHTML = tabs.map(([rep, col])=>{
    const cnt = rep==="All" ? allAccts.length : DATA[rep]?.length || 0;
    const dot = col ? `<span class="rep-dot" style="background:${col}"></span>` : `<span class="rep-dot" style="background:var(--text-muted)"></span>`;
    return `<button class="rep-tab${activeRep===rep?" active":""}" onclick="selectRep(\'${rep}\')">${dot}${rep}<span class="rep-badge">${cnt}</span></button>`;
  }).join("");
}

function renderFilters() {
  document.getElementById("filtersRow").innerHTML = `<input class="search-box" type="text" placeholder="Search accounts..." value="${esc(searchQ)}" oninput="onSearch(this.value)" style="margin-left:0;width:280px">`;
}

function filtered() {
  let list = [...allAccts];
  if (activeRep!=="All") list = list.filter(a=>a.rep===activeRep);
  if (activeStatus!=="All") list = list.filter(a=>a.status===activeStatus);
  if (activeTier!=="All") list = list.filter(a=>a.tier===activeTier);
  if (searchQ) {
    const q = searchQ.toLowerCase();
    list = list.filter(a=>(a.account||"").toLowerCase().includes(q)||(a.city||"").toLowerCase().includes(q)||(a.state||"").toLowerCase().includes(q)||(a.contact_name||"").toLowerCase().includes(q)||(a.contact_title||"").toLowerCase().includes(q));
  }
  list.sort((a,b)=>{
    let va=a[sortField]||0, vb=b[sortField]||0;
    if (typeof va==="string") va=va.toLowerCase(), vb=(vb||"").toLowerCase();
    return va<vb?-sortDir:va>vb?sortDir:0;
  });
  return list;
}

function rowKey(a) { return a.rep+"||"+a.account; }

function renderTable() {
  const list = filtered();
  document.getElementById("resultLine").textContent = list.length+" account"+(list.length!==1?"s":"");
  if (!list.length) {
    document.getElementById("tbody").innerHTML = `<tr><td colspan="9"><div class="empty">No accounts match the current filters.</div></td></tr>`;
    return;
  }
  const rows = list.map(a=>{
    const key = rowKey(a);
    const col = repColor(a.rep);
    const isOpen = openKey===key;
    const eng = engaged[key] || (a.engaged && a.engaged!=="None" ? a.engaged : "");
    const isEngaged = !!eng;
    const pct = ((a.score||0)/100*100).toFixed(0);
    const tierCls = a.tier==="A"?"tb-a":a.tier==="B"?"tb-b":"tb-c";
    const statCls = a.status==="Priority"?"sp-priority":a.status==="Bench"?"sp-bench":"sp-stretch";
    const loc = [a.city,a.state].filter(Boolean).join(", ")||"—";
    const safeAcct = esc(a.account);
    const safeRep = esc(a.rep);
    const safeKey = esc(key);
    let dr = "";
    if (isOpen) {
      const website = a.website ? `<div style="margin-top:10px"><a class="web-link" href="${/^https?:/.test(a.website)?a.website:"https://"+a.website}" target="_blank" rel="noopener">${esc(a.website)} &nearr;</a></div>` : "";
      const ctxContacts = CONTACTS[a.account] || [];
      const ctxCount = ctxContacts.length;
      const contactListHtml = ctxCount > 0
        ? ctxContacts.slice(0,15).map(c=>{
            const av = c.n.split(' ').map(w=>w[0]||'').slice(0,2).join('');
            return `<div class="citem">
              <div class="citem-avatar" style="background:${col}22;color:${col}">${esc(av)}</div>
              <div class="citem-body">
                <div class="citem-name">${esc(c.n)}</div>
                <div class="citem-title">${esc(c.t)}</div>
                ${c.e?`<a class="citem-email" href="mailto:${esc(c.e)}">${esc(c.e)}</a>`:''}
                ${c.p?`<div class="citem-phone">${esc(c.p)}</div>`:''}
              </div>
            </div>`;
          }).join('')
        : `<div class="contacts-none">No contacts in Org62 yet.<br>Search LinkedIn for CMO, VP Marketing, or Director Digital Marketing.</div>`;
      dr = `<tr class="detail-tr"><td colspan="9"><div class="detail-panel">
        <div>
          ${a.why_it_fits?`<div class="dl">Why It Fits</div><div class="dt">${esc(a.why_it_fits)}</div>`:""}
          ${a.watchout?`<div style="margin-top:14px"><div class="dl">Watch-out</div><div class="dt">${esc(a.watchout)}</div></div>`:""}
          ${a.signals?`<div style="margin-top:14px"><div class="dl">Signals</div><div class="dt">${esc(a.signals)}</div></div>`:""}
          ${website}
        </div>
        <div>
          <div class="contacts-header">
            <span>Contacts</span>
            <span class="contacts-count">${ctxCount} in Org62</span>
          </div>
          <div class="contacts-scroll">${contactListHtml}</div>
        </div>
        <div>
          <div class="dl">Score Breakdown</div>
          ${[["Marketing (30%)",a.marketing],["Web (20%)",a.web],["Search (25%)",a.search],["Vertical (25%)",a.vertical]].map(([lbl,val])=>`
          <div class="sbd-row">
            <span class="sbd-label">${lbl}</span>
            <div class="sbd-track"><div class="sbd-fill" style="width:${val||0}%"></div></div>
            <span class="sbd-val">${val||"—"}</span>
          </div>`).join("")}
          ${a.confidence?`<div style="margin-top:14px"><div class="dl">Confidence</div><div class="dt">${esc(a.confidence)}</div></div>`:""}
          ${a.existing_customer?`<div style="margin-top:10px"><div class="dl">Existing Customer</div><div class="dt">${esc(a.existing_customer)}</div></div>`:""}
        </div>
      </div></td></tr>`;
    }
    const acctDisplay = a.org62_id ? `<a class="org62-link" href="https://org62.my.salesforce.com/${a.org62_id}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${safeAcct}</a>` : safeAcct;
    return `<tr class="data-row${isOpen?" open":""}" onclick="toggleRow(${JSON.stringify(key)})">
      <td><div style="display:flex;align-items:center"><div class="rep-bar" style="background:${col}"></div></div></td>
      <td><span class="rank-n">${a.rank}</span></td>
      <td><div class="acct-name">${acctDisplay}</div><div class="acct-loc">${esc(loc)}</div>${a.contact_name?`<div class="acct-contact-line" style="color:${col}">${esc(a.contact_name)}<span class="acct-contact-sep">·</span><span style="opacity:.7;font-weight:400">${esc(a.contact_title)}</span></div>`:`<div class="acct-no-contact">· No contact yet</div>`}</td>
      <td><span class="rep-chip"><span class="rep-chip-dot" style="background:${col}"></span>${safeRep}</span></td>
      <td><div class="score-cell"><span class="score-num">${a.score||"—"}</span><div class="score-track"><div class="score-fill" style="width:${pct}%"></div></div></div></td>
      <td><span class="tier-badge ${tierCls}">${a.tier}</span></td>
      <td><span class="status-pill ${statCls}">${a.status}</span></td>
      <td onclick="event.stopPropagation()"><button class="eng-btn${isEngaged?" yes":""}" onclick="toggleEngaged(${JSON.stringify(key)})">${isEngaged?"Engaged":"Mark"}</button></td>
      <td><span class="chevron">&#9654;</span></td>
    </tr>${dr}`;
  }).join("");
  document.getElementById("tbody").innerHTML = rows;
}

function renderAll() { renderKPIs(); renderTabs(); renderFilters(); renderTable(); }

function selectRep(rep) { activeRep=rep; openKey=null; renderAll(); }
function selectStatus(s) { activeStatus=s; openKey=null; renderTable(); renderFilters(); }
function selectTier(t) { activeTier=t; openKey=null; renderTable(); renderFilters(); }
function onSearch(v) { searchQ=v; openKey=null; renderTable(); }
function doSort(f) {
  if (sortField===f) sortDir*=-1; else { sortField=f; sortDir=-1; }
  renderTable();
}
function toggleRow(key) { openKey = openKey===key ? null : key; renderTable(); }
function toggleEngaged(key) { engaged[key] = engaged[key] ? "" : "Yes"; renderTable(); }

renderAll();
</script>
</body>
</html>
